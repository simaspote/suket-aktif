<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suket Aktif Belajar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        body { background-color: #f4f7f6; overflow-x: hidden; }
        .sidebar-gradient { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; min-height: 100vh; box-shadow: 4px 0 15px rgba(0,0,0,0.1); }
        .form-glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; padding: 20px; }
        .form-label { font-weight: 500; font-size: 0.9rem; color: #e0e6ed; }
        .form-control, .form-select { background-color: rgba(255, 255, 255, 0.9); border: none; }
        .form-control:focus, .form-select:focus { box-shadow: 0 0 0 0.25rem rgba(255,255,255,0.25); }
        .preview-area { height: 100vh; padding: 0; background-color: #525659; /* Warna khas background PDF viewer */ display: flex; flex-direction: column; }
        #pdfPreview { width: 100%; flex-grow: 1; border: none; }
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #adb5bd; }
        .empty-state i { font-size: 4rem; margin-bottom: 1rem; opacity: 0.5; }
    </style>
</head>
<body>

    <div class="container-fluid">
        <div class="row h-100">
            <!-- KIRI: Area Form (Sidebar) -->
            <div class="col-md-4 col-lg-3 sidebar-gradient p-4 d-flex flex-column">
                <div class="mb-4 text-center">
                    <h5 class="fw-bold mb-0">E-Suket Aktif</h5>
                    <small class="text-light opacity-75">SDN Tampojung Tenggina</small>
                </div>

                <div id="loading" class="text-center py-4 form-glass mb-4">
                    <div class="spinner-border text-light" role="status"></div>
                    <p class="mt-2 mb-0 small">Menghubungkan ke Database...</p>
                </div>

                <form id="formSurat" class="d-none form-glass flex-grow-0">
                    <div class="mb-3">
                        <label for="selectKelas" class="form-label"><i class="fas fa-chalkboard-teacher me-2"></i>Rombongan Belajar</label>
                        <select class="form-select shadow-sm" id="selectKelas" required>
                            <option value="">-- Pilih Kelas --</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="selectSiswa" class="form-label"><i class="fas fa-user-graduate me-2"></i>Nama Siswa</label>
                        <select class="form-select shadow-sm" id="selectSiswa" required disabled>
                            <option value="">-- Pilih Siswa --</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="noSurat" class="form-label"><i class="fas fa-file-signature me-2"></i>Nomor Surat Keluar</label>
                        <input type="text" class="form-control shadow-sm" id="noSurat" value="400.3.5/      /432.301.10.15/2026" required>
                    </div>

                    <div class="mb-4">
                        <label for="tglSurat" class="form-label"><i class="fas fa-calendar-alt me-2"></i>Tanggal Surat</label>
                        <input type="date" class="form-control shadow-sm" id="tglSurat" required>
                    </div>

                    <button type="button" id="btnCetak" class="btn btn-light w-100 fw-bold shadow text-primary mb-2" disabled>
                        <i class="fas fa-download me-2"></i>Unduh PDF
                    </button>
                </form>
                
                <div class="mt-auto pt-4 text-center">
                    <small class="opacity-50">&copy; 2026 Administrasi Digital</small>
                </div>
            </div>

            <!-- KANAN: Area Preview -->
            <div class="col-md-8 col-lg-9 preview-area position-relative">
                <!-- State Kosong sebelum siswa dipilih -->
                <div id="emptyPreview" class="empty-state bg-light">
                    <i class="fas fa-file-pdf"></i>
                    <h4>Preview Surat</h4>
                    <p>Pilih siswa pada panel di sebelah kiri untuk melihat tampilan surat.</p>
                </div>
                
                <!-- Iframe untuk menampilkan PDF secara live -->
                <iframe id="pdfPreview" class="d-none"></iframe>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby6LpPC88fFzDGTvZ5CEP84ktHG_s0nOMviSyfHNnigBJnHQZ_80GnJ9tcrvPefPd73/exec';
        const LOGO_URL = 'https://upload.wikimedia.org/wikipedia/commons/8/84/Lambang_Daerah_Kab._Pamekasan%2C_Jawa_Timur.png';

        let allStudents = [];
        let logoBase64 = null;
        let logoOriginalWidth = 0;
        let logoOriginalHeight = 0;

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('tglSurat').value = new Date().toISOString().split('T')[0];
            preloadLogo(LOGO_URL);

            fetch(SCRIPT_URL)
                .then(response => response.json())
                .then(data => {
                    allStudents = data;
                    initKelas();
                    document.getElementById('loading').classList.add('d-none');
                    document.getElementById('formSurat').classList.remove('d-none');
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('loading').innerHTML = '<p class="text-danger mb-0">Gagal memuat data.</p>';
                });
        });

        function preloadLogo(url) {
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.onload = function () {
                logoOriginalWidth = img.width;
                logoOriginalHeight = img.height;
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                logoBase64 = canvas.toDataURL('image/png');
            };
            img.src = url;
        }

        function initKelas() {
            const kelasSet = [...new Set(allStudents.map(s => s.rombel))].sort();
            const selectKelas = document.getElementById('selectKelas');
            
            kelasSet.forEach(kelas => {
                let opt = document.createElement('option');
                opt.value = kelas;
                opt.textContent = 'Kelas ' + kelas;
                selectKelas.appendChild(opt);
            });
        }

        document.getElementById('selectKelas').addEventListener('change', function() {
            const selectedKelas = this.value;
            const selectSiswa = document.getElementById('selectSiswa');
            selectSiswa.innerHTML = '<option value="">-- Pilih Siswa --</option>';
            resetPreview();
            
            if (!selectedKelas) {
                selectSiswa.disabled = true;
                return;
            }

            const filtered = allStudents.filter(s => s.rombel === selectedKelas);
            filtered.sort((a, b) => a.nama.localeCompare(b.nama));

            filtered.forEach((s, index) => {
                let opt = document.createElement('option');
                opt.value = index;
                opt.textContent = s.nama;
                opt.dataset.student = JSON.stringify(s);
                selectSiswa.appendChild(opt);
            });

            selectSiswa.disabled = false;
        });

        // Trigger update preview secara otomatis saat ada perubahan input
        ['selectSiswa', 'noSurat', 'tglSurat'].forEach(id => {
            document.getElementById(id).addEventListener('input', handlePreviewUpdate);
        });

        function handlePreviewUpdate() {
            const selectSiswa = document.getElementById('selectSiswa');
            if (!selectSiswa.value) {
                resetPreview();
                return;
            }
            
            document.getElementById('btnCetak').disabled = false;
            
            const studentData = JSON.parse(selectSiswa.options[selectSiswa.selectedIndex].dataset.student);
            const noSurat = document.getElementById('noSurat').value;
            const tglSurat = document.getElementById('tglSurat').value;

            // Generate PDF untuk preview
            const doc = createPDFDocument(studentData, noSurat, tglSurat);
            
            // Tampilkan Blob URL di iframe
            const pdfBlob = doc.output('bloburl');
            document.getElementById('emptyPreview').classList.add('d-none');
            const iframe = document.getElementById('pdfPreview');
            iframe.src = pdfBlob;
            iframe.classList.remove('d-none');
        }

        function resetPreview() {
            document.getElementById('btnCetak').disabled = true;
            document.getElementById('emptyPreview').classList.remove('d-none');
            document.getElementById('pdfPreview').classList.add('d-none');
            document.getElementById('pdfPreview').src = '';
        }

        document.getElementById('btnCetak').addEventListener('click', function() {
            const selectSiswa = document.getElementById('selectSiswa');
            const studentData = JSON.parse(selectSiswa.options[selectSiswa.selectedIndex].dataset.student);
            const noSurat = document.getElementById('noSurat').value;
            const tglSurat = document.getElementById('tglSurat').value;

            const doc = createPDFDocument(studentData, noSurat, tglSurat);
            doc.save(`Suket_Aktif_${studentData.nama.replace(/\s+/g, '_')}.pdf`);
        });

        function formatTanggalIndo(dateStr) {
            if (!dateStr || dateStr === '-') return '-';
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            return `${parts[2]} ${months[parseInt(parts[1]) - 1]} ${parts[0]}`;
        }

        // Fungsi dipisah menjadi pembuat dokumen agar bisa digunakan untuk Preview dan Download
        function createPDFDocument(s, noSurat, tglSurat) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');

            doc.setFont("helvetica", "normal");

            if (logoBase64 && logoOriginalHeight > 0) {
                const targetHeight = 25;
                const aspectRatio = logoOriginalWidth / logoOriginalHeight;
                const targetWidth = targetHeight * aspectRatio;
                doc.addImage(logoBase64, 'PNG', 18, 12, targetWidth, targetHeight);
            }

            doc.setFont("helvetica", "normal");
            doc.setFontSize(12);
            doc.text("PEMERINTAH KABUPATEN PAMEKASAN", 116, 16, { align: "center" });

            doc.setFont("helvetica", "bold");
            doc.setFontSize(16);
            doc.text("DINAS PENDIDIKAN DAN KEBUDAYAAN", 116, 22, { align: "center" });
            doc.text("SD NEGERI TAMPOJUNG TENGGINA", 116, 29, { align: "center" });
            
            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            doc.text("Dusun Sa Asa, Desa Tampojung Tenggina, Waru, Pamekasan, Jawa Timur 69353,", 116, 34, { align: "center" });
            doc.text("Pos-el: sdntampojungtenggina@gmail.com", 116, 39, { align: "center" });

            doc.setLineWidth(0.6);
            doc.line(18, 43, 192, 43);
            doc.setLineWidth(0.2);
            doc.line(18, 44, 192, 44);

            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            doc.text("SURAT KETERANGAN AKTIF BELAJAR", 105, 54, { align: "center" });
            
            doc.setFont("helvetica", "normal");
            doc.setFontSize(12);
            doc.text("Nomor: " + noSurat, 105, 60, { align: "center" });

            let startY = 70;
            const leftCol = 22;
            const colonCol = 72; 
            const valCol = 75;   

            const kepalaSekolah = [
                ["Nama", "MASKUR, S.Pd.SD"],
                ["NIP", "197210101996051001"],
                ["Pangkat/ Golongan", "Pembina Tk I/IV.b"],
                ["Jabatan", "Kepala Sekolah"],
                ["Alamat Sekolah", "Dusun Sa Asa, Desa Tampojung Tenggina, Kec. Waru"]
            ];

            doc.setFontSize(12);
            doc.text("Yang bertanda tangan di bawah ini :", leftCol, startY);
            startY += 6;

            kepalaSekolah.forEach(item => {
                doc.text(item[0], leftCol + 5, startY);
                doc.text(":", colonCol, startY);
                doc.text(item[1], valCol, startY);
                startY += 6;
            });

            startY += 2;
            doc.text("Menyatakan dengan sebenarnya bahwa :", leftCol, startY);
            startY += 6;

            let ttl = `${s.tempatLahir}, ${formatTanggalIndo(s.tanggalLahir)}`;
            let nisNisnStr = `${s.nis} / ${s.nisn}`;

            const siswaInfo = [
                ["Nama", s.nama],
                ["Kelas", String(s.rombel)],
                ["Tempat, tanggal lahir", ttl],
                ["NIS/NISN", nisNisnStr],
                ["Anak dari", `${s.ayah} / ${s.ibu}`],
                ["Alamat", s.alamat]
            ];

            siswaInfo.forEach(item => {
                doc.text(item[0], leftCol + 5, startY);
                doc.text(":", colonCol, startY);
                doc.text(String(item[1]), valCol, startY);
                startY += 6;
            });

            startY += 4;
            let pernyataan = `Anak tersebut benar-benar Siswa dari Sekolah Dasar Negeri Tampojung Tenggina pada tahun pelajaran 2026/2027.`;
            doc.text(doc.splitTextToSize(pernyataan, 168), leftCol, startY);

            startY += 12;
            let penutup = `Demikian pernyataan ini saya buat dengan sebenar-benarnya untuk dapat dipergunakan sebagaimana mestinya.`;
            doc.text(doc.splitTextToSize(penutup, 168), leftCol, startY);

            startY += 15;
            let tglFormatted = formatTanggalIndo(tglSurat);
            doc.text(`Pamekasan, ${tglFormatted}`, 130, startY);
            startY += 6;
            doc.text("Kepala Sekolah", 130, startY);
            startY += 24;
            doc.setFont("helvetica", "bold");
            doc.text("MASKUR, S.Pd.SD", 130, startY);
            doc.setFont("helvetica", "normal");
            startY += 6;
            doc.text("NIP. 19721010 199605 1 001", 130, startY);

            return doc;
        }
    </script>
</body>
</html>
